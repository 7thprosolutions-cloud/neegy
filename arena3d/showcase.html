<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>$NEEGY — Character Turntable</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0e1626;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    color: #fff8e6;
    overflow: hidden;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 10;
    background: rgba(20, 16, 12, 0.6);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 13px;
  }
  #status { margin-top: 8px; color: #ffe9a8cc; }
  button {
    padding: 10px 22px;
    font-weight: bold;
    letter-spacing: 0.5px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(180deg, #ffe9a8, #ffb347);
    color: #201530;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <button id="recordBtn">Record 360&deg; turntable</button>
    <div id="status"></div>
  </div>
  <script type="module" src="/arena3d/showcase.js?v=1"></script>
</body>
</html>
