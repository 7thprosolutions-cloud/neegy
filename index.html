<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neegy — Gold Gunner</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <div class="hud">
      <div class="hud-item">SCORE <span id="score">0</span></div>
      <div class="hud-item">BEST <span id="best">0</span></div>
      <div class="hud-item lives" id="lives">♥ ♥ ♥</div>
    </div>

    <canvas id="game" width="960" height="480"></canvas>

    <div id="overlay" class="overlay">
      <h1>NEEGY</h1>
      <p class="tagline">Gold Gunner Arcade</p>
      <p class="hint">Enemies rush from both sides — shoot them down and survive.</p>
      <div class="controls">
        <div><b>&larr; &rarr;</b> or <b>A / D</b> — move</div>
        <div><b>&uarr;</b> or <b>W</b> — jump</div>
        <div><b>SPACE</b> or <b>click</b> — shoot</div>
      </div>
      <button id="startBtn">PLAY</button>
      <p class="footnote">No sign up. Just your score.</p>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
